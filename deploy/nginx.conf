# Example nginx site for IO Vault on a VPS.
# Replace YOUR_DOMAIN with your hostname, then:
#   sudo ln -s /path/to/repo/deploy/nginx.conf /etc/nginx/sites-available/io-vault
#   sudo ln -s /etc/nginx/sites-available/io-vault /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d YOUR_DOMAIN
#
# Assumes the app listens on 127.0.0.1:8787 (Docker or npm start).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
